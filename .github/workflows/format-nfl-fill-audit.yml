name: Format NFL execution audit
on:
  push:
    branches: [research/nfl-fill-diagnostics-20261018]
    paths: [.github/workflows/format-nfl-fill-audit.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nfl-fill-diagnostics-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - run: |
          ruff check --fix research/nfl_live_fill_audit.py tests/test_nfl_live_fill_audit.py
          ruff format research/nfl_live_fill_audit.py tests/test_nfl_live_fill_audit.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/nfl_live_fill_audit.py tests/test_nfl_live_fill_audit.py
            git commit -m "Format read-only fill audit"
            git push origin HEAD:research/nfl-fill-diagnostics-20261018
          fi
