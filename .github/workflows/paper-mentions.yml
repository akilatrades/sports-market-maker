name: Mention markets paper test
# PAPER ONLY: no order reaches Kalshi (RESEARCH_LOG.md, 2026-11-24, "Mention
# markets, a forward paper test"). Reads Kalshi's public market data and
# trades, records hypothetical resting NO orders and their results in
# outputs/paper_mentions/. No account, no keys, no Odds API credits.
# The racing paper test (2026-11-26) runs in the same job, same rule, and
# writes outputs/paper_racing/. The ladder-outlier paper test (2026-11-26,
# NBA props) runs here too and writes outputs/paper_ladder/. The read-only
# consistency scan (2026-11-26, 7 days) writes outputs/consistency/.
on:
  # GitHub starts this repository's schedules late; the sportsbook job runs
  # every ~12 minutes, so this follows it and skips unless 50 minutes passed.
  workflow_run:
    workflows: ["book lines"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-mentions
  cancel-in-progress: false
jobs:
  paper:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is a run due?
        id: due
        run: |
          echo "state=$(python -m live.paper_mentions --due)" >> "$GITHUB_OUTPUT"
          echo "racing=$(python -m live.paper_racing --due)" >> "$GITHUB_OUTPUT"
          echo "ladder=$(python -m live.paper_ladder --due)" >> "$GITHUB_OUTPUT"
          echo "scan=$(python -m research.consistency_scan --due)" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.due.outputs.state == 'due' || steps.due.outputs.racing == 'due' || steps.due.outputs.ladder == 'due' || steps.due.outputs.scan == 'due'
        run: pip install -r requirements.txt
      - name: Paper run (mentions)
        if: steps.due.outputs.state == 'due'
        run: python -m live.paper_mentions
      - name: Paper run (racing)
        if: steps.due.outputs.racing == 'due'
        continue-on-error: true
        run: python -m live.paper_racing
      - name: Paper run (ladder outliers)
        if: steps.due.outputs.ladder == 'due'
        continue-on-error: true
        run: python -m live.paper_ladder
      - name: Consistency scan (read-only)
        if: steps.due.outputs.scan == 'due'
        continue-on-error: true
        timeout-minutes: 12
        run: python -m research.consistency_scan
      - name: Commit the ledgers
        if: steps.due.outputs.state == 'due' || steps.due.outputs.racing == 'due' || steps.due.outputs.ladder == 'due' || steps.due.outputs.scan == 'due'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/paper_mentions outputs/paper_racing outputs/paper_ladder outputs/consistency
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Paper tests $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
