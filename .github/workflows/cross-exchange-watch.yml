name: Cross-exchange prop watch
on:
  pull_request:
    paths:
      - "live/compare_polymarket_us.py"
      - "tests/test_compare_polymarket_us.py"
      - ".github/workflows/cross-exchange-watch.yml"
  schedule:
    - cron: "25 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KALSHI_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Format preview (research branch only)
        if: github.event_name == 'pull_request'
        run: |
          pip install ruff==0.11.13
          ruff format --diff live/compare_polymarket_us.py tests/test_compare_polymarket_us.py
      - name: Compare public US exchange props (GET only)
        run: python -m live.compare_polymarket_us
      - name: Commit read-only evidence
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/cross_exchange/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cross-exchange public prop snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs
          git push
