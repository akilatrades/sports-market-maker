name: NFL production read-only opportunity probe
on:
  push:
    branches: [pilot/prod-nfl-supervised-20261018]
    paths: [.github/workflows/probe-prod-nfl.yml, live/prod_nfl_pilot.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm production market candidates without using private keys
        env:
          KALSHI_ENV: prod
          TRADE_MODE: dry
        run: python -m live.prod_nfl_pilot --dry-run
