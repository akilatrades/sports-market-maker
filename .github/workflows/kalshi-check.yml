name: Kalshi public API availability (no account secrets)
# Never load a funded-account trading private key on a hosted Actions runner.
# Authenticated checks belong on the private Droplet in a secured session.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public market data availability without credentials
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          url = "https://api.elections.kalshi.com/trade-api/v2/markets?limit=1"
          with urlopen(url, timeout=15) as response:
              payload = json.load(response)
          if not isinstance(payload.get("markets"), list):
              raise RuntimeError("Public Kalshi market endpoint returned an unexpected response")
          print("Kalshi production public API is reachable. No private keys were used.")
          PY
