name: Format bounded NBA production candidate code
on:
  push:
    branches: [feature/nba-production-readiness-20261018]
    paths: [.github/workflows/format-nba-readiness.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nba-production-readiness-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - run: |
          ruff check --fix live/prod_nba_auto.py tests/test_prod_nba_auto.py
          ruff format live/prod_nba_auto.py tests/test_prod_nba_auto.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live/prod_nba_auto.py tests/test_prod_nba_auto.py
            git commit -m "Format bounded NBA safety checks"
            git push origin HEAD:feature/nba-production-readiness-20261018
          fi
