name: Esports ratings study (research)
# Elo team ratings against Kalshi's pre-match price (RESEARCH_LOG.md,
# 2026-11-24). Research only: no orders, no account, no Odds API credits.
# Reads Kalshi's public esports markets (resumable), then scores the plan
# written before any data. Commits data/esports/ and outputs/esports_ratings/.
on:
  push:
    branches: [main]
    paths: ["research/esports_ratings.py", ".github/workflows/esports-ratings.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: esports-ratings
  cancel-in-progress: false
jobs:
  study:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Research only; kept out of requirements.txt (the server's packages).
      - run: pip install statsmodels==0.14.4
      - name: Kalshi's public esports markets (resumes)
        run: python -m research.esports_ratings fetch
      - name: Score
        run: python -m research.esports_ratings score
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/esports outputs/esports_ratings
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Esports ratings study $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
