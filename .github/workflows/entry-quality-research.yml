name: Start isolated entry research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funded-droplet-code-release
  cancel-in-progress: false
jobs:
  spread-observer:
    if: >-
      github.repository == 'akilatrades/sports-market-maker' &&
      github.ref == 'refs/heads/main' && github.actor == 'akilatrades' &&
      github.triggering_actor == 'akilatrades'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: funded-droplet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install isolated GET-only recorder and private export hook
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DROPLET_USER" == trader ]]
          [[ "$DROPLET_KNOWN_HOSTS" == *ssh-ed25519* ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DROPLET_HOST"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/smm_entry_research
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/smm_entry_research > /dev/null
          remote="$DROPLET_USER@$DROPLET_HOST"
          ssh_args=(-T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/smm_entry_research)
          release="/home/trader/spread-entry-quality/releases/$REVISION"
          tar -czf /tmp/entry-research.tgz research/__init__.py research/spread_entry_quality.py research/spread_entry_recorder.py research/spread_forward_core.py research/spread_forward_candidates.py research/spread_forward_recorder.py deploy/spread_entry_control.py deploy/repair_spread_export.py tools/export_private_fills.py
          ssh "${ssh_args[@]}" "$remote" "umask 077; mkdir -p '$release'; tar -xzf - -C '$release'" < /tmp/entry-research.tgz
          python="/home/trader/sports-market-maker-prod-auto/.venv/bin/python"
          ssh "${ssh_args[@]}" "$remote" "cd '$release' && '$python' -m deploy.spread_entry_control"
      - name: Remove temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/smm_entry_research /tmp/entry-research.tgz
  nba-paper:
    if: github.repository == 'akilatrades/sports-market-maker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize paper study and audit existing paper fills
        run: python -m research.nba_entry_runner
      - name: Commit public paper research only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/nba_entry_study
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record equal-size NBA paper research"
          git pull --rebase
          git push
