name: Pause spread entries only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pause:
    if: >-
      github.ref == 'refs/heads/main' && github.actor == 'akilatrades' &&
      github.triggering_actor == 'akilatrades'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: funded-droplet
    concurrency:
      group: funded-droplet-code-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set spread stop switch and verify with read-only requests
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DROPLET_USER" == trader ]]
          test -n "$DROPLET_HOST"
          [[ "$DROPLET_KNOWN_HOSTS" == *ssh-ed25519* ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/smm_spread_pause
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/smm_spread_pause > /dev/null
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -i ~/.ssh/smm_spread_pause "$DROPLET_USER@$DROPLET_HOST" \
            '/home/trader/sports-market-maker-prod-auto/.venv/bin/python -' \
            < deploy/pause_spread_entries.py
      - name: Remove temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/smm_spread_pause
