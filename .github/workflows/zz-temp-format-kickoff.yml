name: Temporary format NFL kickoff fix
on:
  push:
    branches:
      - fix/nfl-use-scheduled-kickoff-20261018
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nfl-use-scheduled-kickoff-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - name: Format kickoff fix
        run: |
          ruff format live/nfl_trade.py markets/nfl/roster_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/nfl_trade.py markets/nfl/roster_guard.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format verified NFL kickoff guard"
          git push
