name: Production auto read-only opportunity scan
on:
  push:
    branches: [pilot/fully-auto-prod-nfl-20261018]
    paths: [".github/workflows/probe-prod-nfl-auto.yml"]
permissions:
  contents: read
jobs:
  dry-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read-only production candidate and quote recheck
        env:
          KALSHI_ENV: prod
          TRADE_MODE: dry
        run: python -m live.prod_nfl_auto --dry-run
