name: polymarket probe
# Inventory only (RESEARCH_LOG.md, 2026-10-18): what sports markets Polymarket lists.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m research.polymarket.probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/polymarket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polymarket probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs
          git push
