name: Stage legacy refresh files

# Deliberate opt-in only. Copies reviewed files into a private staging
# directory; does NOT alter an installed Python module, runner, or timer.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-runner-migration
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ruff==0.11.13
      - run: |
          set -euo pipefail
          ruff check live/nba_inputs.py live/legacy_input_sync.py deploy/freeze_legacy_runner.py
          ruff format --check live/nba_inputs.py live/legacy_input_sync.py deploy/freeze_legacy_runner.py
          pytest -q tests/test_legacy_input_sync.py tests/test_freeze_legacy_runner.py

  stage:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
      STAGING_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned-host key
        run: |
          set -euo pipefail
          [[ "$DROPLET_USER" == trader ]]
          [[ "$STAGING_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/legacy_stage
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/legacy_stage ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/legacy_stage >/dev/null
      - name: Stage immutable source files without changing installed worker
        run: |
          set -euo pipefail
          target="$DROPLET_USER@$DROPLET_HOST"
          args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/legacy_stage")
          stage="/home/trader/.cache/smm-legacy-prepared-$STAGING_SHA"
          ssh -T "${args[@]}" "$target" \
            "test ! -L '$stage' && mkdir -m 700 -p '$stage' && test \"\$(stat -c %U '$stage')\" = trader"
          scp -q "${args[@]}" \
            live/nba_inputs.py live/legacy_input_sync.py deploy/freeze_legacy_runner.py \
            "$target:$stage/"
          local_checks="$(sha256sum live/nba_inputs.py live/legacy_input_sync.py deploy/freeze_legacy_runner.py | cut -d ' ' -f1 | paste -sd: -)"
          remote_checks="$(ssh -T "${args[@]}" "$target" "cd '$stage' && sha256sum nba_inputs.py legacy_input_sync.py freeze_legacy_runner.py | cut -d ' ' -f1 | paste -sd: -")"
          # Compare digests by name, not default directory sort.
          if [[ "$local_checks" != "$remote_checks" ]]; then
            echo "::error::Staged file hash mismatch"
            exit 1
          fi
          ssh -T "${args[@]}" "$target" \
            "python3 -m py_compile '$stage/nba_inputs.py' '$stage/legacy_input_sync.py' '$stage/freeze_legacy_runner.py' && test -e /home/trader/run.sh && echo STAGED_ONLY_SHA=$STAGING_SHA && echo NO_LIVE_WORKER_CHANGED"
