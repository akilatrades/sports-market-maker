name: Publish NBA production inputs (data only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nba-production-inputs.yml'
      - 'live/nba_publish_check.py'
      - 'live/nba_projections.py'
      - 'live/nba_inputs.py'
  schedule:
    # Opening week: an early 11:30 UTC (6:30 AM Central) backup run,
    # a 12:30 UTC (7:30 AM Central) refresh, then three later updates.
    # Scheduled Actions may start late: do not infer freshness from the cron.
    - cron: '30 11,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nba-production-inputs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: pip install -r requirements.txt
      - name: Download NBA history
        run: python -m live.fetch_nba_data
      - name: Price current Kalshi production markets (NO orders)
        env:
          KALSHI_ENV: prod
        run: python -m live.nba_projections
      - name: Verify model checksum, timestamp, probabilities and ticker uniqueness
        run: python -m live.nba_publish_check
      - name: Publish only versioned projection inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/projections/latest.csv
          test -s outputs/projections/latest_meta.json
          # Save just the verified data pair before bringing this disposable
          # Actions checkout up to the latest main. Never publish generated
          # ledgers or automatically deploy/re-arm any trading code.
          cp outputs/projections/latest.csv "$RUNNER_TEMP/nba-latest.csv"
          cp outputs/projections/latest_meta.json "$RUNNER_TEMP/nba-latest-meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # CRITICAL: git reset --hard leaves UNTRACKED generated inputs on
            # disk. Never mistake those new files for published repo content.
            # Only compare with the exact metadata blob in the Git HEAD.
            set +e
            python - "$RUNNER_TEMP/nba-latest-meta.json" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          from datetime import datetime

          fresh = json.loads(pathlib.Path(sys.argv[1]).read_text())
          baseline = subprocess.run(
              ["git", "show", "HEAD:outputs/projections/latest_meta.json"],
              capture_output=True,
              text=True,
              check=False,
          )
          if baseline.returncode == 0:
              remote = json.loads(baseline.stdout)
              newest = datetime.fromisoformat(fresh["generated_utc"].replace("Z", "+00:00"))
              previous = datetime.fromisoformat(remote["generated_utc"].replace("Z", "+00:00"))
              if previous >= newest:
                  # Only a COMMITTED same/newer bundle is a real publish.
                  subprocess.run(
                      ["git", "cat-file", "-e", "HEAD:outputs/projections/latest.csv"],
                      check=True,
                  )
                  print("A newer or equal COMMITTED projection bundle is published.")
                  sys.exit(10)
          PY
            code=$?
            set -e
            if [[ "$code" == "10" ]]; then exit 0; fi
            if [[ "$code" != "0" ]]; then exit "$code"; fi
            cp "$RUNNER_TEMP/nba-latest.csv" outputs/projections/latest.csv
            cp "$RUNNER_TEMP/nba-latest-meta.json" outputs/projections/latest_meta.json
            python -m live.nba_publish_check
            git add -- outputs/projections/latest.csv outputs/projections/latest_meta.json
            if git diff --cached --quiet; then
              echo "Identical projection files already committed."
              exit 0
            fi
            git commit -m "NBA verified projection input snapshot"
            if git push origin HEAD:main; then
              git fetch origin main
              # A passing job must verify both blobs exist ON THE REMOTE.
              git cat-file -e origin/main:outputs/projections/latest.csv
              git cat-file -e origin/main:outputs/projections/latest_meta.json
              echo "Published and remotely verified NBA model input pair."
              exit 0
            fi
            echo "Main advanced during data publish; retrying ($attempt/3)."
          done
          echo "Unable to publish NBA inputs; no unverified success." >&2
          exit 1
