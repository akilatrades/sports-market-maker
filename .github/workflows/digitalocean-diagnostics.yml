name: DigitalOcean approved diagnostics
# Manual, owner-only, read-only inventory of the server.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digitalocean-diagnostics-unattended
  cancel-in-progress: false
jobs:
  diagnostics:
    if: >-
      github.ref == 'refs/heads/main' && github.actor == 'akilatrades' &&
      github.triggering_actor == 'akilatrades'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: funded-droplet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Always execute the trusted, merged diagnostic script.
      - name: Validate SSH configuration
        env:
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_HOST_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH prerequisites supplied; no credentials printed"
      - name: Read full redacted droplet inventory
        env:
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < deploy/droplet_inventory.sh
