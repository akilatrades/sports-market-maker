name: player-pool page (read-only)
# Keeps the NBA player-pool page current without anyone rebuilding it
# (research/nba_player_pool_dashboard.html).
#
#   stats   rewrites outputs/player_pool/latest.json from public box scores.
#           It also grades the pick'em forward check
#           (outputs/pickem_forward/summary.json).
#   prices  until the night's last game tips off: reads Kalshi's public bid
#           and ask about every three minutes, and every second pass reprices
#           the props with the stat model (the projections job's own pricing
#           function). Both go out as small files on the data-only branch
#           player-pool-live. Nothing is added to main, and nothing the
#           projections job writes is touched. About every 10 minutes it
#           also starts the "book lines" and "pick'em app lines" workflows
#           (each keeps its own rules, scope and credit floor), because
#           GitHub runs their own schedules only a few times a day and the
#           page's sportsbook and app times went many hours stale.
#
# PUBLIC data only. No keys, no account, no orders.
#
# It starts when the projections job finishes: GitHub has been starting this
# repository's own scheduled jobs about six hours late and only a few times a
# day, so a clock of its own would not keep anything current. The schedules
# below are early starts for the prices job, set hours ahead of when they
# are wanted. A start that finds a watcher running waits its turn; one that
# finds no game ahead ends at once.
on:
  workflow_run:
    workflows: ["projections"]
    types: [completed]
  schedule:
    - cron: "10 3 * * *"
    - cron: "10 6 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "research/nba_player_pool_dashboard.py"
      - "research/nba_player_pool_dashboard.template.html"
      - "research/player_pool_quotes.py"
      - "research/player_pool_model.py"
      - "tests/test_nba_player_pool_dashboard.py"
      - "tests/test_player_pool_quotes.py"
      - "tests/test_player_pool_model.py"
      - "tests/test_player_pool_workflow.py"
      - ".github/workflows/player-pool-page.yml"
      - "research/pickem_lines.py"
      - "tests/test_pickem_lines.py"
      - ".github/workflows/pickem-lines.yml"
      - "research/returning_regular.py"
      - "tests/test_returning_regular.py"
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: >-
          pytest -q tests/test_nba_player_pool_dashboard.py
          tests/test_player_pool_quotes.py tests/test_player_pool_model.py
          tests/test_player_pool_workflow.py tests/test_pickem_lines.py
          tests/test_returning_regular.py
  stats:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: player-pool-stats
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m live.fetch_nba_data
      - run: python -m research.nba_player_pool_dashboard --data-only
      # Grades yesterday's pick'em picks against the new box scores
      # (RESEARCH_LOG.md, 2026-11-23). Reads committed files only; a failure
      # here must not hold back the Players-tab data.
      - name: Pick'em forward check
        run: python -m research.pickem_forward || echo "::warning::the pick'em forward check failed"
      - name: Commit the Players-tab data when the box scores have changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/player_pool/latest.json outputs/pickem_forward/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Player-pool page data"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
  prices:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A job may run six hours; the loop below stops itself at five and a half.
    timeout-minutes: 345
    permissions:
      contents: write
      # Only to start the two line workflows (see the loop below).
      actions: write
    concurrency:
      # One watcher at a time. A start that arrives while one is running
      # waits and takes over when it ends.
      group: player-pool-prices
      cancel-in-progress: false
    env:
      KALSHI_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Box scores for the stat model
        run: python -m live.fetch_nba_data
      - name: Publish Kalshi's quotes and the stat model until the last game tips off
        env:
          # This run's own short-lived token, to start the line workflows only.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          dir=outputs/player_pool
          stop=$((SECONDS + 330 * 60))
          fetched=$SECONDS
          lines=-99999
          failures=0
          pass=0
          while [ "$SECONDS" -lt "$stop" ]; do
            # Sportsbook lines (near scope: games within 6.5 hours) and the
            # pick'em apps, about every 10 minutes (20 until 2026-11-23; the
            # owner's request, since app lines lag the sportsbooks by minutes,
            # not hours). A failed start is only a warning; the quotes still
            # go out.
            if [ $((SECONDS - lines)) -ge 600 ]; then
              gh workflow run books.yml -f scope=near \
                || echo "::warning::could not start book lines"
              gh workflow run pickem-lines.yml \
                || echo "::warning::could not start pick'em app lines"
              lines=$SECONDS
            fi
            status=0
            python -m research.player_pool_quotes --out "$dir/kalshi_quotes.json" || status=$?
            # 0: quotes written, games still ahead. 3: written, none ahead.
            if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
              failures=0
              # The stat model every second pass. If it fails, its last file
              # stays and the quotes still go out.
              if [ "$status" -eq 0 ] && [ $((pass % 2)) -eq 0 ]; then
                if [ $((SECONDS - fetched)) -ge 7200 ]; then
                  python -m live.fetch_nba_data || echo "::warning::box scores not refreshed"
                  fetched=$SECONDS
                fi
                timeout 600 python -m research.player_pool_model --out "$dir/model.json" \
                  || echo "::warning::the stat model pass failed"
              fi
              # One commit with no history, so the branch never grows.
              tree=$(for name in kalshi_quotes.json model.json; do
                  if [ -f "$dir/$name" ]; then
                    printf '100644 blob %s\t%s\n' "$(git hash-object -w "$dir/$name")" "$name"
                  fi
                done | git mktree)
              commit=$(git commit-tree "$tree" -m "Player-pool prices $(date -u +%Y-%m-%dT%H:%MZ)")
              git push --quiet --force origin "$commit:refs/heads/player-pool-live" \
                || echo "::warning::could not publish this pass"
            else
              failures=$((failures + 1))
              echo "::warning::pass failed with status $status ($failures in a row)"
              if [ "$failures" -ge 10 ]; then exit 1; fi
            fi
            if [ "$status" -eq 3 ]; then break; fi
            pass=$((pass + 1))
            sleep 170
          done
