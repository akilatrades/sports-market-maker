name: Autoformat research pilot branch
on:
  push:
    branches: [pilot/fully-auto-prod-nfl-20261018]
    paths:
      - ".github/workflows/format-nfl-auto.yml"
      - "live/prod_nfl_auto.py"
      - "tests/test_prod_nfl_auto.py"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/fully-auto-prod-nfl-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - run: |
          ruff check --fix live/prod_nfl_auto.py tests/test_prod_nfl_auto.py
          ruff format live/prod_nfl_auto.py tests/test_prod_nfl_auto.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live/prod_nfl_auto.py tests/test_prod_nfl_auto.py
            git commit -m "Format unattended production pilot and tests"
            git push origin HEAD:pilot/fully-auto-prod-nfl-20261018
          fi
