name: Reconciliation offline formatting
on:
  push:
    branches: [fix/private-account-reconciliation-capture]
    paths: [.github/workflows/reconciliation-format-temporary.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.11.13
      - run: ruff format tools/account_reconciliation_snapshot.py tests/test_account_reconciliation_snapshot.py
      - run: ruff check tools/account_reconciliation_snapshot.py tests/test_account_reconciliation_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-reconciliation-source
          path: |
            tools/account_reconciliation_snapshot.py
            tests/test_account_reconciliation_snapshot.py
          retention-days: 1
